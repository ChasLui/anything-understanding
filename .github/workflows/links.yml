---
name: links

on:
  schedule:
    # Weekly: catch external link rot that PR-time checks cannot see.
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lychee:
    name: markdown links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check links in Markdown
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress --max-retries 2 --accept 200,206,429
            --exclude 'localhost'
            --exclude 'api\.vikingdb\.cn-beijing\.volces\.com'
            --exclude 'xie\.infoq\.cn'
            --exclude 'github\.com/ChasLui/anything-understanding/actions/workflows/verify\.yml'
            './**/*.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
